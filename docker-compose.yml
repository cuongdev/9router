services:
  9router:
    build: .
    image: 9router
    container_name: 9router
    restart: unless-stopped
    ports:
      - "20128:20128"
    env_file:
      - .env
    environment:
      # Force the data dir onto the mounted volume so config/DB survive rebuilds.
      # This overrides any DATA_DIR value that may exist in .env.
      DATA_DIR: /app/data
    volumes:
      - 9router-data:/app/data

volumes:
  # Pinned name so `docker compose` and ./start.sh always share the SAME volume.
  9router-data:
    name: 9router-data
